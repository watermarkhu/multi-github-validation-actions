name: Cross-GitHub validation push

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or SHA to push to the target.
        required: true
        type: string
      target_server_url:
        description: Server URL of the target GitHub (e.g. https://github.com or https://ghes.example).
        required: true
        type: string
      repository:
        description: Target repository in 'owner/repo' form on the target GitHub.
        required: true
        type: string
      base_branch:
        description: Base branch when mode=pr. Default 'main'.
        required: false
        type: string
        default: main
      mode:
        description: "'direct' or 'pr'. Default 'direct'."
        required: false
        type: string
        default: direct
      pr_labels:
        description: Space-delimited PR labels (only used when mode=pr).
        required: false
        type: string
        default: ""
      check_name:
        description: Name of the upstream check run to create.
        required: false
        type: string
        default: cross-github-validation
      branch_prefix:
        description: Prefix for the target branch name.
        required: false
        type: string
        default: cross-validation
      sign_commit:
        description: When true, create the amended commit via the GitHub Git Data API so it is signed by the target GitHub App. Default false.
        required: false
        type: boolean
        default: false
    secrets:
      upstream_app_id:
        description: GitHub App ID registered on the upstream GitHub instance (this side).
        required: true
      upstream_private_key:
        description: PEM-encoded private key for the upstream GitHub App.
        required: true
      target_app_id:
        description: GitHub App ID registered on the target GitHub instance.
        required: true
      target_private_key:
        description: PEM-encoded private key for the target GitHub App.
        required: true

permissions: {}

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout this action repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha || github.sha }}
          path: .cross-github-validation
          persist-credentials: false

      - name: Push to target
        uses: ./.github/actions/push
        with:
          ref: ${{ inputs.ref }}
          target_server_url: ${{ inputs.target_server_url }}
          repository: ${{ inputs.repository }}
          base_branch: ${{ inputs.base_branch }}
          mode: ${{ inputs.mode }}
          pr_labels: ${{ inputs.pr_labels }}
          check_name: ${{ inputs.check_name }}
          branch_prefix: ${{ inputs.branch_prefix }}
          sign_commit: ${{ inputs.sign_commit }}
          upstream_app_id: ${{ secrets.upstream_app_id }}
          upstream_private_key: ${{ secrets.upstream_private_key }}
          target_app_id: ${{ secrets.target_app_id }}
          target_private_key: ${{ secrets.target_private_key }}
